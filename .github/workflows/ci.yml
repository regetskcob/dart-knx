name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed -l 120 packages
      - run: dart analyze --fatal-infos packages
      - run: cd packages/knx && dart test
      - run: cd packages/knx_io && dart test
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: cd python/kberry && pip install -e '.[test]' && pytest -q
