name: knx
description: >-
  KNX protocol in pure Dart: addresses, cEMI frames, KNXnet/IP headers, datapoint types and
  KNX Secure (IP Secure, Data Secure). Runs on the VM, in Flutter and on the web.
version: 0.2.2
repository: https://github.com/regetskcob/dart-knx/tree/main/packages/knx
issue_tracker: https://github.com/regetskcob/dart-knx/issues
topics: [knx, home-automation, smart-home, iot, protocol]

environment:
  sdk: ^3.13.0

dependencies:
  # Only for package:knx/secure.dart (AES, SHA-256, PBKDF2).
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

resolution: workspace
